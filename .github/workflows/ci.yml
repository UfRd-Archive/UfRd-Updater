name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run pytest -q
      - name: Validate example configuration
        run: uv run ufrd-updater validate --config examples/updater.toml

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Flake check
        run: nix flake check
      - name: Build package
        run: nix build .#default
      - name: Run CLI
        run: nix run . -- --help
